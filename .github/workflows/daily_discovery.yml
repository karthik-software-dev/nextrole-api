name: NextRole Daily Job Discovery

on:
  schedule:
    # 0. Test Trigger: 03:45 PM IST (10:15 UTC)
    - cron: '15 10 * * *'
    # 1. Run 1 - Morning Market Sync: 09:03 AM IST (03:33 UTC)
    - cron: '33 3 * * *'
    # 2. Run 2 - Mid-day Ingestion: 12:03 PM IST (06:33 UTC)
    - cron: '33 6 * * *'
    # 3. Run 3 - Afternoon Crawl: 03:03 PM IST (09:33 UTC)
    - cron: '33 9 * * *'
    # 4. Run 4 - Evening Sync: 06:03 PM IST (12:33 UTC)
    - cron: '33 12 * * *'
    # 5. Run 5 - Night Roundup: 09:03 PM IST (15:33 UTC)
    - cron: '33 15 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Target scraper source'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - indeed
          - naukri
          - linkedin
          - wellfound
          - target_companies
      live_fetch:
        description: 'Force live crawl (vs cached)'
        required: false
        default: true
        type: boolean

concurrency:
  group: discovery-crawler
  cancel-in-progress: false

jobs:
  run_job_discovery:
    name: Headless ATS Crawler & Cloud DB Sync
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers & OS Dependencies
        run: |
          playwright install --with-deps chromium

      - name: Execute Discovery Engine & Sync to PostgreSQL
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: "app"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || 'rahulkarthik056@gmail.com' }}
          ADMIN_INITIAL_PASSWORD: ${{ secrets.ADMIN_INITIAL_PASSWORD || '#Karthick979' }}
          GITHUB_ACTIONS: "true"
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CI_PIPELINE_SOURCE: ${{ github.event_name }}
          CI_PIPELINE_ID: ${{ github.run_id }}
          CI_PIPELINE_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          SOURCE_NAME="${{ inputs.source || 'all' }}"
          echo "Starting job discovery for source: $SOURCE_NAME"
          python app/main.py --source=$SOURCE_NAME --live
