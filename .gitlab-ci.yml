stages:
  - scrape

run_job_discovery:
  stage: scrape
  image: mcr.microsoft.com/playwright/python:v1.40.0-jammy
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  variables:
    PYTHONUNBUFFERED: "1"
    PYTHONPATH: "."
  script:
    - echo "Installing dependencies in 4GB Playwright runner..."
    - pip install -r requirements.txt
    - echo "Running full multi-source job discovery against PostgreSQL..."
    - python main.py --source=all --live
    - echo "Discovery completed and synced to Aiven cloud database."
